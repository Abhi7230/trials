[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-fit"
version = "0.1.0"
description = "Offline GGUF parser and memory fit planner"
authors = [{name = "Abhi Raj", email = "105153898+Abhi7230@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "cairosvg>=2.7.0",
]

[project.scripts]
gguf-fit = "gguf_fit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gguf_fit --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["src/gguf_fit/cli.py"]
